version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 9 1,15 * *'
      timezone: 'Europe/Warsaw'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
    labels:
      - 'Dependencies'
      - 'npm'
    groups:
      development-dependencies:
        patterns:
          - '*'
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 9 1,15 * *'
      timezone: 'Europe/Warsaw'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'Dependencies'
      - 'GitHub Actions'
