name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: ['22.21.1', '24.0.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Aikido Safe Chain 1.5.3
        shell: bash
        run: |
          curl -fsSL -o /tmp/install-safe-chain.sh https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh
          echo "0107cbbbf90159379756157e902acae512d62ffbd174307e42c5fe9f266792d3  /tmp/install-safe-chain.sh" | sha256sum -c
          sh /tmp/install-safe-chain.sh --ci
      - name: Verify Aikido Safe Chain
        shell: bash
        run: safe-chain --version && npm safe-chain-verify
      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:coverage

      - name: Run build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.0.0'
          cache: 'npm'

      - name: Install Aikido Safe Chain 1.5.3
        shell: bash
        run: |
          curl -fsSL -o /tmp/install-safe-chain.sh https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh
          echo "0107cbbbf90159379756157e902acae512d62ffbd174307e42c5fe9f266792d3  /tmp/install-safe-chain.sh" | sha256sum -c
          sh /tmp/install-safe-chain.sh --ci
      - name: Verify Aikido Safe Chain
        shell: bash
        run: safe-chain --version && npm safe-chain-verify
      - name: Install dependencies
        run: npm ci

      # Real e2e tests against a live auth server. Until E2E_* secrets exist
      # in this repo, npm run test:e2e just self-skips every test (see
      # hasCredentials in e2e/helpers/env.ts).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          E2E_CLIENT_ID: ${{ secrets.E2E_CLIENT_ID }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_SERVER_URL: ${{ secrets.E2E_SERVER_URL }}
          E2E_REDIRECT_URI: ${{ secrets.E2E_REDIRECT_URI }}

      # Traces are disabled in CI (see e2e/playwright.config.ts) since they
      # can capture request/response bodies from real OAuth token exchanges —
      # this just picks up Playwright's lightweight error-context.md files.
      - name: Upload e2e failure context
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-context
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
